# Prometheus alert rules for AgencyBD. Load with `rule_files:` in prometheus.yml; scrape /metrics with an API key that has metrics:read.
groups:
  - name: agencybd
    rules:
      - alert: ApiDown
        expr: up{job="agencybd"} == 0
        for: 2m
        labels: {severity: page}
        annotations: {summary: "AgencyBD API is not answering scrapes"}
      - alert: HighServerErrorRate
        expr: sum(rate(agencybd_http_requests_total{status=~"5.."}[5m])) / sum(rate(agencybd_http_requests_total[5m])) > 0.05
        for: 10m
        labels: {severity: page}
        annotations: {summary: "More than 5% of requests are failing with 5xx"}
      - alert: SlowRequests
        expr: histogram_quantile(0.95, sum(rate(agencybd_http_request_seconds_bucket{route!~"/api/(autopilot|rescan|reports|browser).*"}[10m])) by (le)) > 2.5
        for: 15m
        labels: {severity: ticket}
        annotations: {summary: "p95 latency above 2.5s for ordinary API routes"}
      - alert: BackgroundJobFailing
        expr: increase(agencybd_background_failures_total[1h]) > 3
        labels: {severity: ticket}
        annotations: {summary: "The scheduler or nightly re-scan failed repeatedly"}
      - alert: DiscoveryRunsFailing
        expr: increase(agencybd_discovery_runs_total{status="failed"}[1h]) > 2
        labels: {severity: ticket}
        annotations: {summary: "Discovery runs are failing"}
      - alert: BounceRateHigh
        expr: sum(rate(agencybd_emails_bounced_total[1h])) / clamp_min(sum(rate(agencybd_emails_dispatched_total[1h])), 1e-9) > 0.02
        for: 30m
        labels: {severity: page}
        annotations: {summary: "Bounce rate above 2%: stop sending and check list quality"}
      - alert: SendingStoppedLong
        expr: max(agencybd_sending_halted) == 1
        for: 24h
        labels: {severity: info}
        annotations: {summary: "The stop-sending switch has been on for 24 hours"}
