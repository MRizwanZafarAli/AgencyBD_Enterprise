name: AgencyBD Enterprise CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  hygiene:
    name: Secret scan and repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Fail on committed credentials or tracked runtime files
        run: pytest -q tests/test_repo_hygiene.py --noconftest

  frontend:
    name: Frontend typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint --if-present
      - run: npm run build

  e2e:
    name: End-to-end (Playwright, Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: pip install -r requirements.txt
      - run: cd frontend && npm ci
      - name: Run end-to-end tests
        env: {AGENCYBD_BROWSER_NO_SANDBOX: "on"}
        run: ./scripts/e2e.sh

  test-and-security:
    name: Test Matrix & Security Audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run Test Suite with Pytest
        env:
          PYTHONPATH: .
          AGENCYBD_ENV: test
          AGENCYBD_SKIP_DOTENV: "1"
        run: |
          pytest -v --cov=. --cov-report=term-missing

      - name: Verify Docker Container Build
        run: |
          docker build -t agencybd-enterprise:test .
